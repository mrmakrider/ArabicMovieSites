name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Pull requests never receive a write token or repository secrets.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test publishing freshness guard
        run: python3 -B -m unittest discover -s .github/tests -v
      - name: Run resource regression tests
        run: bash ./gradlew --no-daemon :ExampleProvider:testDebugUnitTest
      - name: Build all plugins without publishing
        run: bash ./gradlew --no-daemon make makePluginsJson

  publish:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-builds
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: Checkout builds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: builds
          path: builds
          # Required only here for the authenticated push below.
          persist-credentials: true
      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure publishing secret
        working-directory: src
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: printf 'DISCORD_URL=%s\n' "$DISCORD_URL" > .env
      - name: Build plugins
        working-directory: src
        run: |
          bash ./gradlew --no-daemon make makePluginsJson
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3
          cp -- */build/*.cs3 "$GITHUB_WORKSPACE/builds/"
          cp -- build/plugins.json "$GITHUB_WORKSPACE/builds/"
      - name: Commit and push builds
        working-directory: builds
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add --all
          if ! git diff --staged --quiet; then
            git commit -m "Build $GITHUB_SHA"
            # Validation can finish out of order. Check while holding the publish
            # concurrency slot, immediately before the only remote write.
            current_sha="$(git ls-remote --exit-code origin "$GITHUB_REF" | awk '{print $1}')"
            if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not establish the source branch tip; refusing publication." >&2
              exit 1
            fi
            if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
              echo "Skipping superseded build $GITHUB_SHA (current tip: $current_sha)."
              exit 0
            fi
            git push origin HEAD:builds
          fi
